name: FFmpeg

on:
  workflow_call:

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: native/${{ matrix.rid }}
          key: ffmpeg-${{ matrix.rid }}-${{ matrix.os }}-${{ hashFiles('build/ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/ffmpeg.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
