name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: src/FoxIPTV/FoxIPTV.csproj

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: native/${{ matrix.rid }}
          key: ffmpeg-${{ matrix.rid }}-${{ matrix.os }}-${{ hashFiles('build/ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/ffmpeg.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release

      - name: Test
        run: dotnet test tests/FoxIPTV.Tests/FoxIPTV.Tests.csproj -c Release
