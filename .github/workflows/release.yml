name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: src/FoxIPTV/FoxIPTV.csproj

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: windows-x64
            ext: .exe
            binary: FoxIPTV.exe
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
            ext: ''
            binary: FoxIPTV
          - os: macos-latest
            rid: osx-arm64
            name: macos-arm64
            ext: ''
            binary: FoxIPTV

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          TAG="${VERSION}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag: $TAG)"

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Test
        run: dotnet test tests/FoxIPTV.Tests/FoxIPTV.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:SelfUpdate=true
          -o publish

      - name: Name the executable
        shell: bash
        run: cp publish/${{ matrix.binary }} FoxIPTV-${{ steps.version.outputs.tag }}-${{ matrix.name }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: FoxIPTV-${{ steps.version.outputs.tag }}-${{ matrix.name }}
          path: FoxIPTV-${{ steps.version.outputs.tag }}-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum FoxIPTV-* > SHA256SUMS && cat SHA256SUMS

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FoxIPTV ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/FoxIPTV-${{ steps.version.outputs.tag }}-windows-x64.exe
            artifacts/FoxIPTV-${{ steps.version.outputs.tag }}-linux-x64
            artifacts/FoxIPTV-${{ steps.version.outputs.tag }}-macos-arm64
            artifacts/SHA256SUMS
