name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: src/FoxIPTV/FoxIPTV.csproj
  VPK_VERSION: '1.2.161'
  PACK_ID: FoxIPTV

jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: win
            exe: FoxIPTV.exe
            icon: src/FoxIPTV/Assets/FoxIPTV.ico
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
            exe: FoxIPTV
            icon: ''
          - os: macos-latest
            rid: osx-arm64
            channel: osx
            exe: FoxIPTV
            icon: src/FoxIPTV/Assets/FoxIPTV.icns

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Test
        run: dotnet test tests/FoxIPTV.Tests/FoxIPTV.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Fetch the previous release for delta updates
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel ${{ matrix.channel }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Pack
        run: >
          vpk pack
          -u ${{ env.PACK_ID }}
          -v ${{ steps.version.outputs.version }}
          -p publish
          -e ${{ matrix.exe }}
          --channel ${{ matrix.channel }}
          --packTitle FoxIPTV
          --packAuthors "Fox Council"
          ${{ matrix.icon && format('--icon {0}', matrix.icon) || '' }}
          -o releases

      - uses: actions/upload-artifact@v4
        with:
          name: releases-${{ matrix.channel }}
          path: releases

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: releases-*
          path: releases

      - name: List packages
        run: find releases -type f | sort

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Upload to the GitHub release
        run: |
          for channel in win linux osx; do
            vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --channel "$channel" -o "releases/releases-$channel" --tag ${{ steps.version.outputs.tag }} --releaseName "FoxIPTV ${{ steps.version.outputs.tag }}" --publish --merge
          done
